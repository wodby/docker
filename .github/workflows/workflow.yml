name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'

  pull_request:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME || '' }}
        DOCKER_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DOCKER_PASSWORD || '' }}
      with:
        version: 3
        tags: latest
  dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME || '' }}
        DOCKER_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.DOCKER_PASSWORD || '' }}
      with:
        version: 3
        tags: dev
        dev: 1

  image-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ latest, dev ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-release@412e2d9ce29c41835ff653b0945bba72eabd9efb
